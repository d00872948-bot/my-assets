:root{--coral:#FF7377;--ice:#71D7FF;--sand:#EFEBCC;--ink:#022028;--white:#FFFFFF;
--font-display:'Cera Condensed','Arial Narrow',sans-serif;--font-body:'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--white);font-family:var(--font-body);padding:24px;overflow:hidden}
.wm{position:fixed;right:-18vw;top:50%;width:70vmax;height:70vmax;margin-top:-35vmax;color:var(--coral);opacity:.12;animation:spin 50s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.box{position:relative;width:100%;max-width:420px}
.k{font-family:var(--font-display);font-weight:900;text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--ice)}
h1{font-family:var(--font-display);font-weight:900;text-transform:uppercase;line-height:.9;font-size:clamp(44px,12vw,68px);margin-top:12px}
h1 em{font-style:normal;color:var(--coral)}
p{margin-top:14px;color:rgba(255,255,255,.75);font-size:15px;line-height:1.5}
form{margin-top:26px;display:grid;gap:12px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:15px 18px;border-radius:12px;border:2px solid transparent;background:var(--sand);color:var(--ink);outline:none}
input[type=password]:focus{border-color:var(--ice)}
button{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:17px;padding:15px 26px;border-radius:100px;border:0;background:var(--coral);color:var(--white);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:rgba(255,255,255,.75);cursor:pointer}
.err{color:var(--coral);font-size:14px;min-height:20px}
@media(prefers-reduced-motion:reduce){.wm{animation:none}}
